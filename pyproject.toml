[project]
name = "remote-terminal-mcp"
version = "0.1.0"
description = "MCP server for remote command execution with HTTP/WebSocket transport"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.26.0",
]

[project.scripts]
remote-terminal-mcp = "remote_terminal_mcp.server:run_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/remote_terminal_mcp"]
